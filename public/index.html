<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GTAV Collectors Map</title>
    <meta
      name="description"
      content="Interactive GTA V collectors map with OutlawDB-backed data feeds."
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <aside class="sidebar">
      <h1>GTAV Collectors Map</h1>
      <p class="subtitle">RDR2CollectorsMap-style workflow, GTA V data</p>

      <div class="controls">
        <label>
          Search
          <input id="search" placeholder="signal jammer; action figure" />
        </label>

        <label>
          Category
          <select id="category">
            <option value="">All categories</option>
          </select>
        </label>

        <label>
          Cycle
          <select id="cycle">
            <option value="">All cycles</option>
            <option value="1">Cycle 1</option>
            <option value="2">Cycle 2</option>
            <option value="3">Cycle 3</option>
            <option value="4">Cycle 4</option>
            <option value="5">Cycle 5</option>
            <option value="6">Cycle 6</option>
            <option value="7">Cycle 7</option>
          </select>
        </label>

        <button id="refresh">Refresh</button>
      </div>

      <div id="summary" class="summary">Loading…</div>
      <ul id="list" class="list"></ul>
    </aside>

    <main id="map"></main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
