<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GTAV Collectors Map</title>
    <meta
      name="description"
      content="Interactive GTA V collectors map with OutlawDB-backed data feeds."
    />
    <link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
    <link rel="stylesheet" href="/vendor/leaflet-markercluster/MarkerCluster.css" />
    <link rel="stylesheet" href="/vendor/leaflet-markercluster/MarkerCluster.Default.css" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <aside class="sidebar">
      <h1>GTAV Collectors Map</h1>
      <p class="subtitle">RDR2CollectorsMap-style workflow, GTA V data</p>

      <div class="sidebar-top">
      <div class="controls">
        <label>
          Search
          <input id="search" placeholder="signal jammer; action figure" />
        </label>

        <label>
          Map style
          <select id="style"></select>
        </label>

        <label>
          Cycle
          <select id="cycle">
            <option value="">All cycles</option>
            <option value="1">Cycle 1</option>
            <option value="2">Cycle 2</option>
            <option value="3">Cycle 3</option>
            <option value="4">Cycle 4</option>
            <option value="5">Cycle 5</option>
            <option value="6">Cycle 6</option>
            <option value="7">Cycle 7</option>
          </select>
        </label>

        <button id="refresh">Refresh</button>
      </div>

      <div class="sidebar-actions">
        <button id="show-all-cats">Show all</button>
        <button id="hide-all-cats">Hide all</button>
      </div>

      <div class="sidebar-actions">
        <button id="fit-visible">Fit visible</button>
        <button id="reset-filters">Reset filters</button>
      </div>

      <div id="summary" class="summary">Loading…</div>

      <div class="panel-header">
        <h2>Categories</h2>
        <button id="toggle-cats" class="ghost">Collapse</button>
      </div>
      <div id="category-panel" class="category-panel"></div>
      </div>

      <div class="list-wrap">
      <ul id="list" class="list"></ul>
      </div>
    </aside>

    <main id="map"></main>

    <script src="/vendor/leaflet/leaflet.js"></script>
    <script src="/vendor/leaflet-markercluster/leaflet.markercluster.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
